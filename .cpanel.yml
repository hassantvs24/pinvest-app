---
# cPanel Git deployment configuration.
# Docs: https://docs.cpanel.net/knowledge-base/web-services/guide-to-git/
#
# The repository path on this server (/home2/kushiara/agor.kushiaraspeed.com)
# IS the subdomain's document root, and the app's root .htaccess forwards
# every request into public/ — so syncing the checkout onto itself keeps
# the web root identical to the deployed commit.
#
# Excluded from sync on purpose:
#   .env / database/database.sqlite / storage  -> live server data, never overwritten
#   .git / node_modules / tests                -> not needed in the web root
deployment:
  tasks:
    - export DEPLOYPATH=/home2/kushiara/agor.kushiaraspeed.com
    - /bin/rsync -av --delete --exclude='.git' --exclude='node_modules' --exclude='tests' --exclude='.env' --exclude='storage' --exclude='database/database.sqlite' ./ $DEPLOYPATH/
